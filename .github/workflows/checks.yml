name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  transport-and-backup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography requests
      - run: python -m unittest discover -s pc/tests -p test_giga_tunnel.py -v
      - run: python -m unittest discover -s pc/tests -p test_panel_relay.py -v
      - run: python -m unittest discover -s pc/tests -p test_probe_local_ota.py -v
      - run: python -m unittest discover -s tools/tests -p test_private_backup.py -v
      - run: python -m unittest discover -s tools/tests -p test_install_model.py -v
  ring-experiment:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - run: python -m unittest discover -s experimental/ring-dimmer/tests -p 'test_*.py' -v
      - run: python -m unittest discover -s experimental/music-spectrum/tests -p 'test_*.py' -v
      - run: python -m unittest discover -s experimental/ring-state/tests -p 'test_*.py' -v
  vpn-coverage-experiment:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m unittest discover -s experimental/vpn-coverage/tests -p 'test_*.py' -v
      - run: python -m unittest discover -s experimental/vpn-relay/tests -p 'test_*.py' -v
  local-service-relay-experiment:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m unittest discover -s experimental/local-service-relay/tests -p 'test_*.py' -v
      - run: python -m unittest discover -s experimental/native-tun2socks/tests -p 'test_*.py' -v
      - run: python -m unittest discover -s experimental/native-tun2socks/runtime-smoke/tests -p 'test_*.py' -v
      - run: python -m unittest discover -s experimental/wifi-standalone/tests -p 'test_*.py' -v
      - name: Fetch pinned host JSON dependency
        run: |
          $target = 'pc/tests/speechify-host/deps/json-20240303.jar'
          New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
          Invoke-WebRequest 'https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar' -OutFile $target
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash -ne '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed') { throw 'DEPENDENCY_HASH_MISMATCH' }
      - name: Direct Wi-Fi network ownership host test
        env:
          STATION_JAVA_HOME: ${{ env.JAVA_HOME }}
        run: python -m unittest discover -s pc/tests -p test_direct_wifi_network.py -v
