[TFTPD32]
BaseDirectory=.
Services=4
Hide=1
LocalIP={LAB_IP}
DHCP LocalIP={LAB_IP}
Enable IPv4=1
Enable IPv6=0
DHCP Ping=0
UnicastBOOTP=0
DHCP Double Answer=0
PersistantLeases=0
UseEventLog=0
SaveSyslogFile=
PipeSyslogMsg=0
Console Password=tftpd32

[DHCP]
IP_Pool={STATION_IP}
PoolSize=1
Mask=255.255.255.0
Gateway={LAB_IP}
DNS={LAB_IP}
DNS2=
WINS=0.0.0.0
BootFile=
DomainName=
Lease (minutes)=60
Lease_NumLeases=0
